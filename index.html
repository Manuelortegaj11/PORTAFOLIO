    <script>
      // Aplica el tema antes de pintar para evitar el destello de tema incorrecto.
      (function () {
        try {
          var saved = localStorage.getItem('tema');
          var dark = saved ? saved === 'oscuro' : matchMedia('(prefers-color-scheme: dark)').matches;
          document.documentElement.dataset.theme = dark ? 'dark' : 'light';
        } catch (e) {
          document.documentElement.dataset.theme = 'light';
        }
      })();
    </script>
